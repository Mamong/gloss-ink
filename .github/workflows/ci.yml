name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack:modules
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright-core install --with-deps chrome
      - run: node scripts/check-standalone-components.cjs artifacts/standalone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-acceptance
          path: |
            artifacts/standalone/dist/acceptance.json
            artifacts/standalone/packages/*.tgz
            artifacts/standalone/package-lock.json
